# commit to be tagged for new release
commit = "HEAD"

project_name = "Talos"
github_repo = "siderolabs/talos"
match_deps = "^github.com/((talos-systems|siderolabs)/[a-zA-Z0-9-]+)$"
ignore_deps = ["github.com/coredns/coredns"]

# previous release
previous = "v1.13.0"

pre_release = true

preface = """
"""

[notes]
    [notes.updates]
        title = "Component Updates"
        description = """\
Linux: 6.18.49
Kubernetes: 1.37.0
containerd: 2.3.4
CoreDNS: 1.14.7

Talos is built with Go 1.26.7.
"""

    [notes.selinux_workloads]
        title = "SELinux Workload Domains"
        description = """\
When the CRI labels containers (`enable_selinux = true` in a `CRICustomizationConfig` document), pods run as `pod_t` with MCS categories,
privileged containers as `pod_privileged_t` (`spc_t` is an alias of it, so charts written for Fedora keep working), and the kubelet
gets `/sys/fs/selinux` and the containers contexts file, so that it labels volumes and its plugin directories.

The new `SELinuxPolicyConfig` document carries a policy module in CIL, which machined compiles with the Talos policy and loads
without a reboot. A module declares one type per workload with the `pod_domain`, `pod_privileged_domain` or `pod_hostmon_domain`
macro, and the workload selects it with `securityContext.seLinuxOptions.type`. A module the compiler rejects is left out and
the others are loaded, at boot as well as on a change; `talosctl get selinuxpolicystatus` names it with the error. The compiled
policy is no longer embedded in machined: the image build ships it with its sources and `secilc` in `/usr/share/selinux/talos`.

A workload writing files which outlive the pod, a hostPath or a local volume, needs a fixed `securityContext.seLinuxOptions.level`
above the range the CRI draws from (`s0:c512` to `s0:c1021`), else the pod of the next start cannot read them. The kube-apiserver
static pod runs at `s0:c1020,c1021` for its audit log; keep that pair for it.
"""

    [notes.selinux_extensions]
        title = "SELinux and System Extensions"
        description = """\
The imager labels the files of system extensions with the `file_contexts` of the Talos rootfs, so that an extension
binary or kernel module carries the label it would have as part of the rootfs.

Extension services in container mode run in a domain of their own, from a rootfs mounted with the `ext_rootfs_t`
context, one type for the files of the image and the mount points the system containerd creates in it. machined
derives a policy module from the service spec, a domain `ext_<name>_t` granted what the mounts and the security options of the spec ask for, with types of its
own for the state directories the service mounts, which no pod reads. A mount of a directory Talos labels below, such as
`/var`, grants the type of that directory only, and the module says which directories are not granted; a mount of `/dev`
reads every block device, STATE included. The modules are compiled with the Talos policy and the `SELinuxPolicyConfig`
documents, at boot and whenever the machine config changes; `talosctl get selinuxmodules` lists them, and `talosctl get
selinuxpolicystatus` reports the set loaded and a rejected one. The imager derives and compiles the same modules, and
refuses an image whose extension service could not be confined. A service whose module is not loaded runs as `ext_t`;
`selinux.type` in `ExtensionServiceConfig` selects another type, `ext_privileged_t` or one declared by a
`SELinuxPolicyConfig` document with the `ext_domain` macro; a service waits for a type no module declares yet. The state
directories keep the types derived from the spec whatever the type: `ext_t` and `ext_privileged_t` reach the state of
every service, a derived or a declared type its own. A pod reaching the state of a service through a hostPath needs a
module granting its domain the state type and `connectto` on the domain of the service; the derived module says how. The
files a pod creates there carry no MCS category, so that the service and other pods read them.

`selinux.audit: true` in `ExtensionServiceConfig`, or `audit: true` in `SELinuxPolicyConfig`, observes a domain:
`talosctl get selinuxdomainstatus <type> -o yaml` lists what it exercised of the permissions the policy grants it,
what it did not, a module narrowed to the exercised ones, and its denials as allow rules to sort out. The narrowed
module is built on the plumbing macro of the domain, `ext_plumbing` or `pod_plumbing`, carries the MCS exemption of the
domain, and warns while the domain has not started since the audit began or the audit log dropped its accesses. The
records lost are a counter of the kernel for every domain; the module `audit-<type>` carries the whole unexercised set.
"""

    [notes.kubespan_peer_endpoint_filters]
        title = "KubeSpan Peer Endpoint Filters"
        description = """\
KubeSpan now supports filtering the endpoints received from other peers via `filters.peerEndpoints` in the `KubeSpanConfig` document.

While `filters.endpoints` filters the addresses a node advertises to the whole cluster, `filters.peerEndpoints` filters the endpoints
received from other peers before the node connects to them, affecting only that node. This allows excluding peer-advertised endpoints
which are known to be unreachable from a node (e.g., addresses of a private network the node is not connected to), so that KubeSpan
endpoint rotation never attempts them.
"""

    [notes.ipvs]
        title = "IPVS Support"
        description = """\
Following Kubernetes deprecation of IPVS support (`kube-proxy`), Talos Linux now ships IPVS as kernel modules which are not loaded by default.

If you require IPVS support, you can enable it by loading the following kernel modules:

* `ip_vs` (core)
* `ip_vs_rr`, `ip_vs_wrr`, `ip_vs_lc`, `ip_vs_sh` or `ip_vs_mh` (scheduling algorithms)
* `xt_ipvs` (nftables/iptables match)
"""

    [notes.lockdown]
        title = "Secure Boot images no longer have lockdown=confidentiality enabled by default"
        description = """\
Secure Boot images no longer have `lockdown=confidentiality` enabled by default.
This change was made to improve compatibility with eBPF tooling under default schematic.
This means that Secure Boot images will now have `lockdown=integrity` enabled by default (implicitly), which is the recommended setting for most users.
Users can override it by adding `lockdown=confidentiality` to the kernel command line through Image Factory if they require it.
"""

    [notes.diskfree]
        title = "Disk Free"
        description = """\
A new `talosctl diskfree` command (aliased to `df`) reports storage and inode usage for mounted volumes.
"""

    [notes.containers_namespace]
        title = "Unified --namespace Flag"
        description = """\
`talosctl containers`, `logs`, `stats` and `restart` now select the containerd namespace through the same `--namespace` flag and vocabulary already used by `talosctl image` and `talosctl debug`: `system` (the default), `cri` for Kubernetes workloads, and `taloscontainers` for containers declared via a `ContainerConfig` document.

The `--kubernetes`/`-k` flag is deprecated in favor of `--namespace cri`.

`talosctl image list` also supports `--namespace taloscontainers`, to inspect images pulled for `ContainerConfig` containers. `talosctl debug` does not support the `taloscontainers` namespace.
"""

    [notes.extension_service_configuration]
        title = "Extension Service Configuration"
        description = """\
`ExtensionServiceConfig` is supported only for extension services whose service manifest explicitly declares a configuration dependency:

```yaml
depends:
  - configuration: true
```

Using `ExtensionServiceConfig` with a service that does not declare this dependency is unsupported and has undefined startup behavior.
The service might start before its configuration is rendered, leaving config files or environment variables unavailable until a later service restart.
Extension authors must declare the dependency before documenting `ExtensionServiceConfig` support.
"""

    [notes.multipath_configuration]
        title = "Multipath Configuration"
        description = """\
The `multipath-tools` system extension now reads `/etc/multipath.conf` from the Talos host instead of using `ExtensionServiceConfig`.
The `multipathd` service waits for this file and bind-mounts it read-only into its service container.

Before updating the extension, apply a machine config patch that deletes the existing `ExtensionServiceConfig` document and adds an `EtcFileConfig` document:

```yaml
apiVersion: v1alpha1
kind: ExtensionServiceConfig
name: multipathd
$patch: delete
---
apiVersion: v1alpha1
kind: EtcFileConfig
name: multipath.conf
mode: 0o644
contents: |
  defaults {
      user_friendly_names yes
      find_multipaths no
      path_selector "round-robin 0"
  }
```

The extension does not provide a default configuration, so `multipathd` remains waiting until `/etc/multipath.conf` is present.
"""

    [notes.macvlan]
        title = "MACVLAN Links"
        description = """\
Talos Linux now supports creating MACVLAN links with a new `MacVLANConfig` document:

```yaml
apiVersion: v1alpha1
kind: MacVLANConfig
name: eth0.macvlan
parent: eth0
mode: bridge # optional, defaults to `bridge`
addresses:
  - address: 192.168.1.100/24
```

The `source` mode is not supported yet, as it requires a list of allowed source MAC addresses.
"""

    [notes.vxlan]
        title = "VXLAN Links"
        description = """\
Talos Linux now supports creating VXLAN links with a new `VXLANConfig` document:

```yaml
apiVersion: v1alpha1
kind: VXLANConfig
name: vxlan100
id: 100 # VXLAN network identifier (VNI)
parent: eth0
local: 10.255.0.1 # or `group:` for a multicast group, but not both
port: 4789 # optional, defaults to 4789
learning: false # optional, defaults to true
addresses:
  - address: 192.168.1.100/24
```
"""

    [notes.kmsg_log_extra_tags]
        title = "Kernel Log Extra Tags"
        description = """\
The `KmsgLogConfig` document now supports an `extraTags` field which attaches additional key-value pairs
to every kernel log message sent to that destination:

```yaml
apiVersion: v1alpha1
kind: KmsgLogConfig
name: apiSink
url: https://kmsglog.api/logs
extraTags:
  cluster: staging-west
  node: worker-1
```

Tags are scoped to the destination they are configured on, so different endpoints can receive different tags.
The keys `facility`, `seq`, `clock`, `priority`, `msg`, `talos-time` and `talos-level` are reserved and rejected,
as they are set by Talos itself.
"""

[make_deps]

    [make_deps.tools]
        variable = "TOOLS"
        repository = "github.com/siderolabs/tools"

    [make_deps.pkgs]
        variable = "PKGS"
        repository = "github.com/siderolabs/pkgs"
